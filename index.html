<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Champion Roller</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Orbitron", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .card {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 40px 50px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            max-width: 420px;
            width: 100%;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 25px;
            color: #f0c674;
            letter-spacing: 1px;
        }

        #champ {
            min-height: 40px;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: #4ddcff;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button {
            background: linear-gradient(135deg, #f0c674, #d4a017);
            border: none;
            border-radius: 12px;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: #111;
            letter-spacing: 1px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 8px 20px rgba(240, 198, 116, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(240, 198, 116, 0.6);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 6px 16px rgba(240, 198, 116, 0.4);
        }
    </style>

    <script type="module" src="page.js"></script>
</head>

<body>
    <div class="card">
        <h1>Which champion is the best ?</h1>
        <h2 id="champ">?</h2>
        <button id="roll">ROLL</button>
    </div>
</body>

</html>
